<div class="m-header">
  <a (click)="returnToHome()" class="b-brand">
    <!-- ========   change your logo hear   ============ -->
    @if (themeMode === false) {
    <img [src]="logo" alt="logo-img" class="logo img-logo" />
    } @else {
    <img [src]="logo" alt="darkMode-logo" class="logo img-logo" />
    }
  </a>
  <br>
  <!-- ======= Menu collapse Icon ===== -->
  <div class="pc-h-item">
    <a href="javascript:" class="pc-head-link head-link-secondary m-0 mobile-menu" [ngClass]="{ on: navCollapsed }"
      id="sidebar-hide mobile-collapse" (click)="navCollapse()" title="Menu Collapse">
      <i class="ti ti-menu-2"></i>
    </a>
  </div>
</div>
