<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h5>Uploader pays et villes</h5>
        </div>

        <div class="card-body">

            <!-- Upload Section -->
            <div class="row align-items-end mb-4">
                <div class="col-md-6">
                    <label for="fileUpload" class="form-label fw-bold">Choisir un fichier JSON</label>
                    <div class="input-group shadow-sm">
                        <input type="text" class="form-control form-control-sm" placeholder="Aucun fichier sélectionné" readonly
                            id="fileName">
                        <label class="input-group-text btn btn-primary" for="fileUpload">
                            <i class="ti ti-folder-up me-1"></i> Parcourir
                        </label>
                        <input type="file" id="fileUpload" (change)="onFileSelected($event)" accept=".json" hidden>
                    </div>
                </div>

                <div class="col-md-6 text-end">
                    <app-submit-spinner [loading]="isSaving" label="Télécharger" icon="ti ti-refresh me-1"
                        cssClass="btn btn-success btn-sm" (clicked)="uploadFileCountry()">
                    </app-submit-spinner>

                    <div *ngIf="message" class="alert alert-info mt-3 py-2 px-3 small shadow-sm">
                        {{ message }}
                    </div>
                </div>
            </div>

            <div class="row">

                <!-- Countries List -->
                <div class="col-lg-7 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold">🌍 Liste des pays</h5>
                            </div>

                            <label class="form-label fw-semibold small text-muted">🔍 Recherchez un pays</label>
                            <app-search-list [searchTerm]="searchTerm" (searchChange)="onSearchCountry($event)">
                            </app-search-list>

                            <app-spinners *ngIf="isLoading" message="⏳ Chargement des pays ..."></app-spinners>

                            <div class="table-responsive" *ngIf="!isLoading">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Pays</th>
                                            <th>Visible <small>création de compte</small> </th>
                                            <th class="text-end">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let country of countriesList">
                                            <td class="fw-semibold">{{ country.name }}</td>
                                            <td>
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" (change)="activeRegister(country, $event)"
                                                        type="checkbox" role="switch" id="switchCheckChecked"
                                                        [checked]="country?.visible_register">
                                                    <label *ngIf="country?.visible_register" class="form-check-label"
                                                        for="switchCheckChecked">Activé</label>
                                                    <label *ngIf="!country?.visible_register" class="form-check-label"
                                                        for="switchCheckChecked">Désactivé</label>
                                                </div>
                                            </td>
                                            <td class="text-end">
                                                <button title="Voir les villes" (click)="retrieveCities(country?.name)"
                                                    class="btn btn-info btn-sm">
                                                    <i class="ti ti-eye me-1"></i>
                                                </button>
                                                <button title="Supprimer" (click)="deleteCountry(country?.name)"
                                                    class="btn btn-danger btn-sm ms-1">
                                                    <i class="ti ti-trash me-1"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <app-set-pagination [currentPage]="pagination?.currentPage"
                                [totalPages]="pagination?.nber_pages" [previousPage]="pagination?.previousPage"
                                [nextPage]="pagination?.nextPage" (pageChange)="onPageChange($event)">
                            </app-set-pagination>
                        </div>
                    </div>
                </div>

                <!-- Cities List -->
                <div class="col-lg-5 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">

                            <h5 class="fw-bold mb-3">🏙️ Liste des villes <span
                                    *ngIf="countrySelected">({{countrySelected}})</span> </h5>

                            <label class="form-label fw-semibold small text-muted">🔍 Recherchez une ville</label>
                            <app-search-list [searchTerm]="searchTermCity" (searchChange)="onSearchCity($event)">
                            </app-search-list>

                            <app-spinners *ngIf="isLoadingCity" message="⏳ Chargement des villes ..."></app-spinners>

                            <div class="table-responsive" *ngIf="!isLoadingCity">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Ville</th>
                                            <th class="text-end">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let city of citiesList">
                                            <td class="fw-semibold">{{ city?.name }}</td>
                                            <td class="text-end">
                                                <button (click)="deleteCities(city?.name)"
                                                    class="btn btn-danger btn-sm">
                                                    Supprimer
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <app-set-pagination [currentPage]="paginationCity?.currentPage"
                                [totalPages]="paginationCity?.nber_pages" [previousPage]="paginationCity?.previousPage"
                                [nextPage]="paginationCity?.nextPage" (pageChange)="onPageChangeCity($event)">
                            </app-set-pagination>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>


<!-- Je dois avoir une colonne affichage pour spécifier où le pays doit être affiché, si je supprime un pays, l'ensemble
des villes est également supprimé, si je coche un pays, toutes ses villes sont cochées -->
