<div class="row">
    <div class="col-12">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <!-- Filter Section -->
                <div class="row g-3 align-items-end mb-4 border-bottom pb-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold text-secondary">Doit contenir</label>
                        <app-search-list [searchTerm]="searchTerm"
                            (searchChange)="onSearchChange($event)"></app-search-list>
                    </div>

                    <!-- Loading spinner -->
                    <app-spinners *ngIf="loading" message="Chargement des logs..."></app-spinners>
                    <div class="col-6 col-md-2">
                        <label for="startDate" class="form-label fw-semibold text-secondary">Date de début</label>
                        <input [(ngModel)]="startDate" type="date" class="form-control form-control-sm shadow-sm"
                            id="startDate">
                    </div>

                    <div class="col-6 col-md-2">
                        <label for="endDate" class="form-label fw-semibold text-secondary">Date de fin</label>
                        <input [(ngModel)]="endDate" type="date" class="form-control form-control-sm shadow-sm"
                            id="endDate">
                    </div>

                    <div class="col-6 col-md-2 d-grid">
                        <button type="button" class="btn btn-outline-primary btn-sm" (click)="validateDates()">✔
                            Valider</button>
                    </div>

                    <div class="col-6 col-md-2 d-grid">
                        <button class="btn btn-outline-secondary btn-sm" (click)="resetFilter()">↺
                            Réinitialiser</button>
                    </div>
                </div>

                <!-- Logs Table -->
                <div class="table-responsive" *ngIf="!loading">
                    <table class="table table-hover table-borderless align-middle mb-4">
                        <thead class="table-light text-muted small">
                            <tr>
                                <th scope="col">🕒 Date et heure</th>
                                <th scope="col">🧾 Table concernée</th>
                                <th scope="col">👤 Utilisateur</th>
                                <th scope="col">📝 Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of auditLogs; trackBy: trackById" class="log-row">
                                <td class="text-nowrap">{{item?.timestamp | date: 'dd MMMM yyyy à HH:mm' : undefined : 'fr'}}</td>
                                <td>{{item?.table_impacted}}</td>
                                <td class="text-muted small">{{item?.user?.email}}</td>
                                <td>{{item?.message}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination Component -->
                <div class="" *ngIf="!loading">
                    <app-set-pagination [currentPage]="pagination?.currentPage" [totalPages]="pagination?.nber_pages"
                        [previousPage]="pagination?.previousPage" [nextPage]="pagination?.nextPage"
                        (pageChange)="onPageChange($event)">
                    </app-set-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
